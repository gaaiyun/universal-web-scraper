name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install test dependencies
        # Light path: install only what the test suite needs to import.
        # Heavy/optional deps (scrapling, playwright, crawlee, aiohttp) are
        # skipped on purpose — the suite uses importorskip/fallbacks for them.
        run: |
          python -m pip install \
            "beautifulsoup4>=4.12.0" \
            "lxml>=5.0.0" \
            "pandas>=2.0.0" \
            pytest \
            pytest-asyncio

      - name: Run tests
        run: python -m pytest tests/ -o addopts="" -v
