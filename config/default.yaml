scraper:
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
  timeout: 30
  retry: 3
  delay: 1.0
  stealth: true

proxy:
  enabled: false
  rotation: false
  pool_size: 10

output:
  format: csv
  encoding: utf-8
  clean: true
  remove_duplicates: true

adapters:
  ecommerce:
    extract_images: true
    extract_reviews: false
  
  job:
    extract_requirements: true
    extract_benefits: false
  
  news:
    extract_tags: true
    extract_comments: false
